[package]
name = "magents"
version = "0.10.0"
edition = "2024"
description = "Mates + agents: a shared session bus for Claude Code, Codex, Copilot, Cursor, Gemini, Grok, and OpenCode"
license = "MIT"
repository = "https://github.com/abnegate/magents"
readme = "README.md"
keywords = ["mcp", "claude", "codex", "grok", "agents"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"

[[bin]]
name = "magents"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.189"
regex = "1.13.1"
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "fs", "process", "io-util", "sync", "time"] }
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
