# Republish server.json to the Official MCP Registry without cutting a new
# GitHub Release. The GHCR image tag must already exist.
name: MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (GHCR tag, no v prefix)
        required: true
        type: string

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  SERVER_NAME: io.github.abnegate/magents

jobs:
  publish:
    name: MCP Registry
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this version is already in the MCP Registry
        id: exists
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME/\//%2F}/versions/${VERSION}")"
          if [ "$status" = "200" ]; then
            echo "::notice::${SERVER_NAME} ${VERSION} is already in the MCP Registry; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set server.json to the requested version
        if: steps.exists.outputs.published == 'false'
        run: .github/scripts/prepare-mcp-server-json.sh "$VERSION" "$VERSION"
      - name: Install mcp-publisher
        if: steps.exists.outputs.published == 'false'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
