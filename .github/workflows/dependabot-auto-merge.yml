name: Dependabot auto-merge

# Dependabot opens PRs but never merges them. This enables GitHub's auto-merge
# on its PRs so they land once the required checks pass, rather than sitting
# until someone notices. Auto-merge only completes when every *required* check
# is green — with none required it would merge immediately, so this is only
# safe alongside the repository's required-status-checks rule.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Majors change APIs and have already forced an MSRV bump once in this
      # fleet, so they stay manual.
      - name: Approve and enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
